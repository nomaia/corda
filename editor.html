<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corda — Editor</title>
  <style>
    :root {
      --purple:      #5C2B8C;
      --purple-dark: #3d1a63;
      --gold:        #D4A843;
      --bg:          #12111a;
      --surface:     #1e1b2e;
      --surface2:    #2a2640;
      --text:        #e8e6f0;
      --text-dim:    #8a88a0;
      --chord-color: #D4A843;
      --fs:          15px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── PASTE SCREEN ──────────────────────────────────── */
    #paste-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    #paste-screen.hidden { display: none; }

    .paste-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 28px 32px;
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.55);
    }

    .paste-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .paste-logo span { font-size: 1.5rem; font-weight: 800; color: var(--gold); letter-spacing: -.02em; }
    .paste-logo small { font-size: .8rem; color: var(--text-dim); margin-top: 3px; }

    .meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr 72px;
      gap: 8px;
    }

    label {
      font-size: .72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .06em;
      display: block;
      margin-bottom: 4px;
    }

    input[type="text"], textarea {
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 11px;
      font-size: .88rem;
      width: 100%;
      outline: none;
      transition: border-color .18s;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--purple); }

    textarea#cifra-input {
      font-family: 'Courier New', monospace;
      font-size: .8rem;
      resize: vertical;
      min-height: 200px;
      max-height: 38vh;
      line-height: 1.55;
    }

    .btn-row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      padding: 9px 18px;
      transition: all .15s;
    }

    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-dark); }

    .btn-gold { background: var(--gold); color: #1a1220; }
    .btn-gold:hover { opacity: .85; }

    .btn-ghost {
      background: rgba(255,255,255,.07);
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,.12);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.13); color: var(--text); }

    .btn-sm { padding: 5px 12px; font-size: .8rem; border-radius: 6px; }
    .btn-icon { padding: 5px 9px; font-size: .95rem; border-radius: 6px; }

    .btn-danger {
      background: rgba(255,70,70,.12);
      color: #ff7070;
      border: 1px solid rgba(255,70,70,.25);
    }
    .btn-danger:hover { background: rgba(255,70,70,.22); }

    /* ─── EDITOR SCREEN ─────────────────────────────────── */
    #editor-screen {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 0;
    }

    /* Header */
    .ed-header {
      background: var(--purple);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    .back-btn {
      background: rgba(255,255,255,.12);
      border: none;
      color: rgba(255,255,255,.85);
      font-size: .95rem;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 6px;
      flex-shrink: 0;
      transition: background .15s;
    }
    .back-btn:hover { background: rgba(255,255,255,.22); }

    .hd-meta {
      flex: 1;
      display: flex;
      gap: 7px;
      min-width: 0;
    }

    .hd-input {
      background: rgba(255,255,255,.14);
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 5px 10px;
      font-size: .84rem;
      outline: none;
      min-width: 0;
    }
    .hd-input::placeholder { color: rgba(255,255,255,.45); }
    .hd-input:focus { background: rgba(255,255,255,.22); }
    .hd-input.title { font-weight: 700; flex: 2; }
    .hd-input.artist { flex: 1.5; }
    .hd-input.key { width: 58px; flex-shrink: 0; }

    .hd-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Toolbar */
    .ed-toolbar {
      background: var(--surface);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      overflow-x: auto;
      white-space: nowrap;
    }

    .tb-sep {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,.12);
      flex-shrink: 0;
    }

    .font-ctl {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      font-size: .8rem;
      flex-shrink: 0;
    }
    .font-ctl span:last-child { font-size: 1.05rem; }

    input[type="range"] {
      width: 74px;
      accent-color: var(--gold);
      flex-shrink: 0;
    }

    /* Sheet wrapper */
    .sheet-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px 60px;
    }

    .sheet {
      max-width: 820px;
      margin: 0 auto;
    }

    /* ─── BLOCKS ────────────────────────────────────────── */
    .block {
      position: relative;
      padding-left: 30px;
      margin-bottom: 2px;
    }

    .block-side {
      position: absolute;
      left: 0;
      top: 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transition: opacity .15s;
    }
    .block:hover .block-side { opacity: 1; }

    .side-btn {
      background: rgba(255,255,255,.07);
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      font-size: .68rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all .13s;
    }
    .side-btn:hover { background: rgba(255,255,255,.15); color: var(--text); }
    .side-btn.del:hover { background: rgba(255,70,70,.2); color: #ff7070; }

    /* Section header */
    .sec-label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .1em;
      padding: 10px 0 3px;
      border-top: 1px solid rgba(212,168,67,.22);
      margin-top: 10px;
      outline: none;
      cursor: text;
      caret-color: var(--gold);
    }
    .sec-label:empty::before { content: '[Seção]'; opacity: .35; }

    /* Chord + lyric */
    .cl-block { line-height: 1; }

    .chord-row {
      position: relative;
      min-height: 1.6em;
      cursor: crosshair;
      user-select: none;
    }

    .ck {
      position: absolute;
      font-family: 'Courier New', Courier, monospace;
      font-size: var(--fs);
      font-weight: 700;
      color: var(--chord-color);
      cursor: pointer;
      padding: 1px 2px;
      border-radius: 3px;
      line-height: 1;
      white-space: nowrap;
      transition: background .1s;
      top: 0;
    }
    .ck:hover { background: rgba(212,168,67,.18); }
    .ck.active { background: rgba(212,168,67,.28); outline: 1px solid var(--gold); }

    .lyric-row {
      font-family: 'Courier New', Courier, monospace;
      font-size: var(--fs);
      color: var(--text);
      outline: none;
      white-space: pre;
      min-height: 1.45em;
      line-height: 1.45;
      padding: 1px 0;
      caret-color: var(--gold);
    }
    .lyric-row:empty::before { content: '\00a0'; }

    /* ─── CHORD POPUP ───────────────────────────────────── */
    #chord-popup {
      position: fixed;
      background: var(--surface);
      border: 1px solid rgba(212,168,67,.35);
      border-radius: 12px;
      padding: 12px 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      z-index: 200;
      display: none;
      flex-direction: column;
      gap: 9px;
      min-width: 170px;
    }
    #chord-popup.open { display: flex; }

    .pop-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #chord-name-inp {
      flex: 1;
      background: var(--surface2);
      border: 1px solid rgba(212,168,67,.35);
      border-radius: 7px;
      color: var(--gold);
      font-family: 'Courier New', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 6px 8px;
      text-align: center;
      outline: none;
      width: 90px;
    }
    #chord-name-inp:focus { border-color: var(--gold); }

    .close-pop {
      background: rgba(255,255,255,.08);
      border: none;
      color: var(--text-dim);
      border-radius: 6px;
      cursor: pointer;
      padding: 5px 8px;
      font-size: .85rem;
      flex-shrink: 0;
      transition: all .13s;
    }
    .close-pop:hover { background: rgba(255,255,255,.16); color: var(--text); }

    .nudge-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nudge-btn {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      padding: 5px 11px;
      font-size: .8rem;
      flex: 1;
      text-align: center;
      transition: background .1s;
      user-select: none;
    }
    .nudge-btn:hover { background: rgba(255,255,255,.16); }

    .nudge-lbl {
      font-size: .68rem;
      color: var(--text-dim);
      text-align: center;
      flex-shrink: 0;
    }

    .pop-del {
      background: rgba(255,70,70,.1);
      border: 1px solid rgba(255,70,70,.25);
      color: #ff7070;
      border-radius: 7px;
      cursor: pointer;
      padding: 6px;
      font-size: .8rem;
      width: 100%;
      transition: background .13s;
    }
    .pop-del:hover { background: rgba(255,70,70,.22); }

    /* ─── TOAST ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      color: var(--text);
      padding: 9px 20px;
      border-radius: 20px;
      font-size: .84rem;
      box-shadow: 0 4px 18px rgba(0,0,0,.45);
      z-index: 999;
      opacity: 0;
      transition: opacity .28s;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.09);
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ─── SCROLLBAR ─────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 3px; }

    /* ─── PRINT ─────────────────────────────────────────── */
    #print-hdr { display: none; }

    @media print {
      body {
        background: #fff;
        color: #000;
        overflow: visible;
        height: auto;
        font-size: 12pt;
      }

      #paste-screen,
      .ed-header,
      .ed-toolbar,
      .block-side,
      #chord-popup,
      #toast { display: none !important; }

      .sheet-wrap {
        overflow: visible;
        padding: 0;
        height: auto;
      }

      .sheet { max-width: 100%; }

      #print-hdr {
        display: block;
        margin-bottom: 18px;
        border-bottom: 2px solid var(--purple);
        padding-bottom: 8px;
      }
      #ph-title { font-size: 18pt; color: #000; font-weight: 800; }
      #ph-meta  { font-size: 10pt; color: #444; margin-top: 3px; }

      .block { padding-left: 0; page-break-inside: avoid; margin-bottom: 1px; }

      .sec-label {
        color: var(--purple);
        border-top: 1px solid #ccc;
        padding-top: 8pt;
        margin-top: 8pt;
        font-size: 8pt;
      }

      .ck {
        color: var(--purple) !important;
        background: transparent !important;
        outline: none !important;
      }

      .lyric-row { color: #000; font-size: 11pt; }
      .chord-row { min-height: 1.4em; }
    }
  </style>
</head>
<body>

<!-- visible only in print -->
<div id="print-hdr">
  <div id="ph-title"></div>
  <div id="ph-meta"></div>
</div>

<!-- ════════ PASTE SCREEN ════════ -->
<div id="paste-screen">
  <div class="paste-card">
    <div class="paste-logo">
      <span>Corda</span>
      <small>— editor de cifra</small>
    </div>

    <div class="meta-row">
      <div>
        <label>Título</label>
        <input type="text" id="ps-title" placeholder="Nome da música">
      </div>
      <div>
        <label>Artista</label>
        <input type="text" id="ps-artist" placeholder="Artista / banda">
      </div>
      <div>
        <label>Tom</label>
        <input type="text" id="ps-key" placeholder="Am">
      </div>
    </div>

    <div>
      <label>Cifra (formato Cifra Club — cole aqui)</label>
      <textarea id="cifra-input" placeholder="Cole o texto da cifra aqui...

Exemplo:
Am        G        F       C
Hello darkness, my old friend

Am        G
I've come to talk with you again

[Refrão]
F         C           Am
Because a vision softly creeping"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn-ghost btn-sm" onclick="loadDraft()">↩ Rascunho salvo</button>
      <button class="btn-primary" onclick="parseCifra()">Editar cifra →</button>
    </div>
  </div>
</div>

<!-- ════════ EDITOR SCREEN ════════ -->
<div id="editor-screen">
  <!-- Header -->
  <div class="ed-header">
    <button class="back-btn" onclick="goBack()">← Nova</button>
    <div class="hd-meta">
      <input class="hd-input title"  id="ed-title"  type="text" placeholder="Título"  oninput="autoSave()">
      <input class="hd-input artist" id="ed-artist" type="text" placeholder="Artista" oninput="autoSave()">
      <input class="hd-input key"    id="ed-key"    type="text" placeholder="Tom"     oninput="autoSave()">
    </div>
    <div class="hd-actions">
      <button class="btn-ghost btn-sm" onclick="addSectionBlock()">+ Seção</button>
      <button class="btn-ghost btn-sm" onclick="addCLBlock()">+ Linha</button>
      <button class="btn-gold  btn-sm" onclick="printPDF()">🖨 PDF</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="ed-toolbar">
    <div class="font-ctl">
      <span>A</span>
      <input type="range" id="fs-range" min="11" max="22" value="15"
             oninput="applyFontSize(this.value)">
      <span>A</span>
    </div>
    <div class="tb-sep"></div>
    <button class="btn-ghost btn-sm" onclick="autoSave(); toast('Rascunho salvo ✓')">💾 Salvar</button>
    <div style="flex:1"></div>
    <span style="font-size:.72rem;color:var(--text-dim)">
      Clique no acorde para editar · Clique na linha vazia para adicionar acorde
    </span>
  </div>

  <!-- Sheet -->
  <div class="sheet-wrap">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<!-- ════════ CHORD POPUP ════════ -->
<div id="chord-popup">
  <div class="pop-top">
    <input type="text" id="chord-name-inp"
           placeholder="Acorde"
           autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false">
    <button class="close-pop" onclick="closePopup()">✕</button>
  </div>
  <div class="nudge-row">
    <button class="nudge-btn"
            onmousedown="startNudge(-1)" onmouseup="stopNudge()" onmouseleave="stopNudge()"
            ontouchstart="startNudge(-1)" ontouchend="stopNudge()">◀◀</button>
    <span class="nudge-lbl">pos</span>
    <button class="nudge-btn"
            onmousedown="startNudge(1)"  onmouseup="stopNudge()" onmouseleave="stopNudge()"
            ontouchstart="startNudge(1)"  ontouchend="stopNudge()">▶▶</button>
  </div>
  <button class="pop-del" onclick="deleteActiveChord()">🗑 Apagar acorde</button>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let blocks       = [];          // source of truth
let activeChord  = null;        // { bi, chordId }
let nudgeTimer   = null;
let chWidth      = 9.6;         // updated when font size changes

const uid = () => Math.random().toString(36).slice(2, 8);

// ══════════════════════════════════════════════════════════
// CHORD DETECTION
// ══════════════════════════════════════════════════════════
// Matches standard chord names: Am, G7, F#m, Bb, Gsus4,
// Cadd9, D/F#, Bm7b5, E7(9), etc.
const CHORD_RE = /^[A-G][b#]?(m(?:aj)?|M|min|dim|aug|sus[24]?|add[29]?)?[0-9]?(\/[A-G][b#]?)?([b#][0-9]|\([^)]+\))?$/;
const SECTION_RE = /^\[.+\]$/;

function isChordToken(t) { return CHORD_RE.test(t); }

function isChordLine(line) {
  const tokens = line.trim().split(/\s+/).filter(Boolean);
  if (!tokens.length) return false;
  // Allow non-chord separators like | |: :|
  const chordish = tokens.filter(t => !/^[|:]+$/.test(t));
  if (!chordish.length) return false;
  return chordish.every(t => isChordToken(t));
}

// ══════════════════════════════════════════════════════════
// PARSER
// ══════════════════════════════════════════════════════════
function parseChordPositions(line) {
  const chords = [];
  let i = 0;
  while (i < line.length) {
    if (line[i] !== ' ' && line[i] !== '\t') {
      const start = i;
      while (i < line.length && line[i] !== ' ' && line[i] !== '\t') i++;
      const text = line.slice(start, i);
      if (isChordToken(text)) {
        chords.push({ id: uid(), text, pos: start });
      }
    } else {
      i++;
    }
  }
  return chords;
}

function parseCifraText(raw) {
  const lines  = raw.split('\n');
  const result = [];
  let i = 0;

  while (i < lines.length) {
    const line    = lines[i];
    const trimmed = line.trim();

    // blank line
    if (!trimmed) { i++; continue; }

    // section header  [Refrão]
    if (SECTION_RE.test(trimmed)) {
      result.push({ type: 'section', text: trimmed });
      i++;
      continue;
    }

    // chord line → look for following lyric line
    if (isChordLine(line)) {
      const chords = parseChordPositions(line);
      let lyrics   = '';
      if (i + 1 < lines.length) {
        const nxt = lines[i + 1];
        if (nxt.trim() && !isChordLine(nxt) && !SECTION_RE.test(nxt.trim())) {
          lyrics = nxt.replace(/\t/g, '    ');
          i += 2;
        } else {
          i++;
        }
      } else {
        i++;
      }
      result.push({ type: 'cl', chords, lyrics });
      continue;
    }

    // plain lyric line
    result.push({ type: 'cl', chords: [], lyrics: line.replace(/\t/g, '    ') });
    i++;
  }

  return result;
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function render() {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '';
  blocks.forEach((block, bi) => sheet.appendChild(renderBlock(block, bi)));
}

function renderBlock(block, bi) {
  const wrap = document.createElement('div');
  wrap.className = 'block';
  wrap.dataset.bi = bi;

  // side buttons
  const side = document.createElement('div');
  side.className = 'block-side';
  side.innerHTML = `
    <button class="side-btn" title="Subir"   onclick="moveBlock(${bi},-1)">↑</button>
    <button class="side-btn" title="Descer"  onclick="moveBlock(${bi},1)">↓</button>
    <button class="side-btn del" title="Apagar" onclick="removeBlock(${bi})">×</button>`;
  wrap.appendChild(side);

  if (block.type === 'section') {
    const el = document.createElement('div');
    el.className     = 'sec-label';
    el.contentEditable = 'true';
    el.textContent   = block.text;
    el.addEventListener('input', () => { blocks[bi].text = el.textContent; autoSave(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); focusNext(bi); } });
    wrap.appendChild(el);

  } else {
    // chord+lyric
    const cl = document.createElement('div');
    cl.className = 'cl-block';

    // chord row
    const cr = document.createElement('div');
    cr.className  = 'chord-row';
    cr.dataset.bi = bi;
    cr.addEventListener('click', e => {
      if (!e.target.classList.contains('ck')) addChordAt(bi, cr, e);
    });

    block.chords.forEach(ch => cr.appendChild(makeToken(bi, ch)));
    cl.appendChild(cr);

    // lyric row
    const lr = document.createElement('div');
    lr.className       = 'lyric-row';
    lr.contentEditable = 'true';
    lr.spellcheck      = false;
    lr.textContent     = block.lyrics || '';

    lr.addEventListener('input', () => { blocks[bi].lyrics = lr.textContent; autoSave(); });

    lr.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        // Split text at cursor
        const offset = caretOffset(lr);
        const full   = blocks[bi].lyrics || '';
        blocks[bi].lyrics = full.slice(0, offset);
        const rest   = full.slice(offset);
        blocks.splice(bi + 1, 0, { type: 'cl', chords: [], lyrics: rest });
        render();
        // focus next lyric row at position 0
        requestAnimationFrame(() => {
          const el = sheet.querySelector(`.block[data-bi="${bi+1}"] .lyric-row`);
          if (el) { el.focus(); setCaretOffset(el, 0); }
          reindex();
        });
        autoSave();
      }
      if (e.key === 'Backspace') {
        // merge with previous block if at start
        if (caretOffset(lr) === 0 && bi > 0 && blocks[bi-1].type === 'cl') {
          e.preventDefault();
          const prevLen = blocks[bi-1].lyrics.length;
          blocks[bi-1].lyrics += blocks[bi].lyrics;
          blocks[bi-1].chords = [...blocks[bi-1].chords, ...blocks[bi].chords];
          blocks.splice(bi, 1);
          render();
          requestAnimationFrame(() => {
            const el = sheet.querySelector(`.block[data-bi="${bi-1}"] .lyric-row`);
            if (el) { el.focus(); setCaretOffset(el, prevLen); }
            reindex();
          });
          autoSave();
        }
      }
    });

    cl.appendChild(lr);
    wrap.appendChild(cl);
  }

  return wrap;
}

function makeToken(bi, chord) {
  const span        = document.createElement('span');
  span.className    = 'ck';
  span.dataset.cid  = chord.id;
  span.style.left   = chord.pos + 'ch';
  span.textContent  = chord.text;
  span.addEventListener('click', e => {
    e.stopPropagation();
    openPopup(bi, chord.id, span);
  });
  return span;
}

// keep data-bi attributes and event handlers in sync after mutations
function reindex() {
  document.querySelectorAll('#sheet .block').forEach((wrap, i) => {
    wrap.dataset.bi = i;
    const btns = wrap.querySelectorAll('.side-btn');
    if (btns[0]) btns[0].onclick = () => moveBlock(i, -1);
    if (btns[1]) btns[1].onclick = () => moveBlock(i,  1);
    if (btns[2]) btns[2].onclick = () => removeBlock(i);

    const cr = wrap.querySelector('.chord-row');
    if (cr) {
      cr.dataset.bi = i;
      cr.onclick    = e => { if (!e.target.classList.contains('ck')) addChordAt(i, cr, e); };
      cr.querySelectorAll('.ck').forEach(tk => {
        tk.onclick = e => { e.stopPropagation(); openPopup(i, tk.dataset.cid, tk); };
      });
    }
  });
}

// ══════════════════════════════════════════════════════════
// POPUP
// ══════════════════════════════════════════════════════════
function openPopup(bi, cid, tokenEl) {
  closePopup(false);
  activeChord = { bi, cid };

  const block = blocks[bi];
  const chord = block.chords.find(c => c.id === cid);
  if (!chord) return;

  tokenEl.classList.add('active');

  const inp = document.getElementById('chord-name-inp');
  inp.value = chord.text;

  const pop  = document.getElementById('chord-popup');
  const rect = tokenEl.getBoundingClientRect();
  const pw   = 178;
  const ph   = 130;
  let left   = rect.left;
  let top    = rect.bottom + 6;
  if (left + pw > window.innerWidth  - 8) left = window.innerWidth  - pw - 8;
  if (top  + ph > window.innerHeight - 8) top  = rect.top - ph - 6;
  pop.style.left = left + 'px';
  pop.style.top  = top  + 'px';
  pop.classList.add('open');

  inp.oninput = () => {
    chord.text = inp.value;
    tokenEl.textContent = inp.value;
    autoSave();
  };

  inp.onkeydown = e => { if (e.key === 'Escape' || e.key === 'Enter') closePopup(); };
  inp.focus();
  inp.select();
}

function closePopup(save = true) {
  const pop = document.getElementById('chord-popup');
  pop.classList.remove('open');
  document.querySelectorAll('.ck.active').forEach(el => el.classList.remove('active'));
  activeChord = null;
  stopNudge();
}

function deleteActiveChord() {
  if (!activeChord) return;
  const { bi, cid } = activeChord;
  blocks[bi].chords = blocks[bi].chords.filter(c => c.id !== cid);
  closePopup(false);
  // remove token from DOM directly (no full re-render needed)
  const tk = document.querySelector(`.chord-row[data-bi="${bi}"] [data-cid="${cid}"]`);
  if (tk) tk.remove();
  autoSave();
}

// ══════════════════════════════════════════════════════════
// NUDGE
// ══════════════════════════════════════════════════════════
function nudgeChord(delta) {
  if (!activeChord) return;
  const { bi, cid } = activeChord;
  const chord = blocks[bi].chords.find(c => c.id === cid);
  if (!chord) return;
  chord.pos = Math.max(0, chord.pos + delta);
  const tk = document.querySelector(`.chord-row[data-bi="${bi}"] [data-cid="${cid}"]`);
  if (tk) tk.style.left = chord.pos + 'ch';
  autoSave();
}

function startNudge(delta) {
  nudgeChord(delta);
  stopNudge();
  nudgeTimer = setInterval(() => nudgeChord(delta), 110);
}
function stopNudge() {
  if (nudgeTimer) { clearInterval(nudgeTimer); nudgeTimer = null; }
}

// ══════════════════════════════════════════════════════════
// ADD CHORD BY CLICKING EMPTY AREA
// ══════════════════════════════════════════════════════════
function addChordAt(bi, crEl, e) {
  measureChWidth();
  const rect  = crEl.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const pos    = Math.max(0, Math.round(clickX / chWidth));

  const chord = { id: uid(), text: '?', pos };
  blocks[bi].chords.push(chord);
  blocks[bi].chords.sort((a, b) => a.pos - b.pos);

  const tk = makeToken(bi, chord);
  crEl.appendChild(tk);

  openPopup(bi, chord.id, tk);
  autoSave();
}

// ══════════════════════════════════════════════════════════
// BLOCK OPERATIONS
// ══════════════════════════════════════════════════════════
function addCLBlock() {
  blocks.push({ type: 'cl', chords: [], lyrics: '' });
  render();
  requestAnimationFrame(() => {
    const rows = document.querySelectorAll('.lyric-row');
    if (rows.length) rows[rows.length - 1].focus();
    reindex();
  });
  autoSave();
}

function addSectionBlock() {
  blocks.push({ type: 'section', text: '[Seção]' });
  render();
  requestAnimationFrame(() => {
    const secs = document.querySelectorAll('.sec-label');
    if (secs.length) {
      const el = secs[secs.length - 1];
      el.focus();
      // select all text so user can type replacement immediately
      document.execCommand('selectAll', false, null);
    }
    reindex();
  });
  autoSave();
}

function removeBlock(bi) {
  if (blocks.length <= 1) return;
  blocks.splice(bi, 1);
  render();
  reindex();
  autoSave();
}

function moveBlock(bi, dir) {
  const ni = bi + dir;
  if (ni < 0 || ni >= blocks.length) return;
  [blocks[bi], blocks[ni]] = [blocks[ni], blocks[bi]];
  render();
  reindex();
  autoSave();
}

function focusNext(bi) {
  const next = document.querySelector(`.block[data-bi="${bi+1}"] .lyric-row, .block[data-bi="${bi+1}"] .sec-label`);
  if (next) next.focus();
}

// ══════════════════════════════════════════════════════════
// FONT SIZE
// ══════════════════════════════════════════════════════════
function applyFontSize(px) {
  document.documentElement.style.setProperty('--fs', px + 'px');
  localStorage.setItem('corda-editor-fs', px);
  measureChWidth();
}

function measureChWidth() {
  const tmp  = document.createElement('span');
  const fs   = getComputedStyle(document.documentElement).getPropertyValue('--fs').trim();
  tmp.style.cssText = `font-family:'Courier New',monospace;font-size:${fs};position:absolute;visibility:hidden;white-space:pre;top:0;left:0`;
  tmp.textContent   = '0000000000'; // 10 chars
  document.body.appendChild(tmp);
  chWidth = tmp.getBoundingClientRect().width / 10;
  document.body.removeChild(tmp);
}

// ══════════════════════════════════════════════════════════
// PARSE & NAVIGATE
// ══════════════════════════════════════════════════════════
function parseCifra() {
  const raw = document.getElementById('cifra-input').value.trim();
  if (!raw) { toast('Cole uma cifra antes de editar'); return; }

  blocks = parseCifraText(raw);
  if (!blocks.length) { toast('Não reconheci acordes na cifra'); return; }

  syncMeta('ps', 'ed');
  showEditor();
  render();
  reindex();
  autoSave();
}

function showEditor() {
  document.getElementById('paste-screen').classList.add('hidden');
}

function goBack() {
  closePopup(false);
  document.getElementById('paste-screen').classList.remove('hidden');
}

function syncMeta(from, to) {
  ['title', 'artist', 'key'].forEach(k => {
    const src = document.getElementById(`${from}-${k}`);
    const dst = document.getElementById(`${to}-${k}`);
    if (src && dst) dst.value = src.value;
  });
}

// ══════════════════════════════════════════════════════════
// SAVE / LOAD
// ══════════════════════════════════════════════════════════
function autoSave() {
  try {
    localStorage.setItem('corda-editor-draft', JSON.stringify({
      title:  document.getElementById('ed-title').value,
      artist: document.getElementById('ed-artist').value,
      key:    document.getElementById('ed-key').value,
      blocks,
    }));
  } catch {}
}

function loadDraft() {
  try {
    const raw = localStorage.getItem('corda-editor-draft');
    if (!raw) { toast('Nenhum rascunho salvo'); return; }
    const data = JSON.parse(raw);
    blocks = data.blocks || [];
    if (!blocks.length) { toast('Rascunho vazio'); return; }

    ['title','artist','key'].forEach(k => {
      document.getElementById(`ps-${k}`).value = data[k] || '';
      document.getElementById(`ed-${k}`).value = data[k] || '';
    });

    showEditor();
    render();
    reindex();
    toast('Rascunho carregado ✓');
  } catch { toast('Erro ao carregar rascunho'); }
}

// ══════════════════════════════════════════════════════════
// PRINT PDF
// ══════════════════════════════════════════════════════════
function printPDF() {
  const title  = document.getElementById('ed-title').value;
  const artist = document.getElementById('ed-artist').value;
  const key    = document.getElementById('ed-key').value;

  document.getElementById('ph-title').textContent = title || 'Sem título';
  let meta = artist || '';
  if (key) meta += (meta ? '  ·  Tom: ' : 'Tom: ') + key;
  document.getElementById('ph-meta').textContent = meta;

  closePopup(false);
  window.print();
}

// ══════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════
let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ══════════════════════════════════════════════════════════
// CARET HELPERS (contenteditable)
// ══════════════════════════════════════════════════════════
function caretOffset(el) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return 0;
  const range    = sel.getRangeAt(0).cloneRange();
  range.selectNodeContents(el);
  range.setEnd(sel.getRangeAt(0).endContainer, sel.getRangeAt(0).endOffset);
  return range.toString().length;
}

function setCaretOffset(el, offset) {
  const range = document.createRange();
  const sel   = window.getSelection();
  let pos     = 0;
  let found   = false;

  function walk(node) {
    if (found) return;
    if (node.nodeType === 3) {        // text node
      const len = node.textContent.length;
      if (pos + len >= offset) {
        range.setStart(node, offset - pos);
        range.collapse(true);
        found = true;
      } else { pos += len; }
    } else {
      for (const c of node.childNodes) walk(c);
    }
  }

  walk(el);
  if (!found) { range.selectNodeContents(el); range.collapse(false); }
  sel.removeAllRanges();
  sel.addRange(range);
}

// ══════════════════════════════════════════════════════════
// GLOBAL EVENTS
// ══════════════════════════════════════════════════════════
// Close popup when clicking outside
document.addEventListener('click', e => {
  const pop = document.getElementById('chord-popup');
  if (!pop.classList.contains('open')) return;
  if (!pop.contains(e.target) && !e.target.classList.contains('ck')) {
    closePopup();
  }
});

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  // restore font size
  const savedFs = localStorage.getItem('corda-editor-fs');
  if (savedFs) {
    applyFontSize(savedFs);
    document.getElementById('fs-range').value = savedFs;
  } else {
    measureChWidth();
  }

  // If there is a draft, pre-fill the meta fields
  try {
    const raw = localStorage.getItem('corda-editor-draft');
    if (raw) {
      const data = JSON.parse(raw);
      if (data.title)  document.getElementById('ps-title').value  = data.title;
      if (data.artist) document.getElementById('ps-artist').value = data.artist;
      if (data.key)    document.getElementById('ps-key').value    = data.key;
    }
  } catch {}
});
</script>
